<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7cc8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Infinite Island Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/touch.css">
  <link rel="stylesheet" href="/css/controller.css">
</head>
<body>
  <!-- (a) join screen: shown when there is no ?room= code (or the code was rejected) -->
  <main id="join" class="screen" hidden>
    <div class="join-card">
      <div class="join-title">Infinite Island</div>
      <div class="join-sub">Controller</div>
      <p class="join-prompt">Type the 4-letter code shown on the game screen</p>
      <div class="code-boxes" id="codeBoxes">
        <input class="code-box" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Code letter 1">
        <input class="code-box" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Code letter 2">
        <input class="code-box" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Code letter 3">
        <input class="code-box" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" aria-label="Code letter 4">
      </div>
      <div class="join-error" id="joinError" role="alert"></div>
      <button type="button" class="join-btn" id="joinBtn">Join</button>
    </div>
  </main>

  <!-- (a2) the join choice (Step 23): shown when the page was opened from the game's QR / link (?room=CODE) -->
  <main id="choice" class="screen" hidden>
    <div class="join-card choice-card">
      <div class="join-title">Infinite Island</div>
      <div class="join-sub">Island <span id="choiceCode"></span></div>
      <p class="join-prompt">How do you want to play?</p>
      <div class="choice-btns">
        <button type="button" class="choice-btn" id="choiceController" data-choice="controller">
          <span class="choice-ico" id="choiceControllerIco"></span>
          <span class="choice-text"><b>Use as controller</b><small>Steer a player on the big screen</small></span>
          <span class="choice-last">Last time</span>
        </button>
        <button type="button" class="choice-btn" id="choicePlay" data-choice="play">
          <span class="choice-ico" id="choicePlayIco"></span>
          <span class="choice-text"><b>Play on this device</b><small>Your own screen, camera and controls</small></span>
          <span class="choice-last">Last time</span>
        </button>
      </div>
      <button type="button" class="choice-other" id="choiceOther">Wrong code? Enter another</button>
    </div>
  </main>

  <!-- (b) controller screen -->
  <main id="pad" class="screen" hidden>
    <div class="topbar">
      <div class="status" id="status" data-state="connecting"><i class="dot"></i><span id="statusText">Connecting…</span></div>
      <div class="room-chip" id="roomChip" title="Room code"></div>
      <button type="button" class="chip-btn" id="changeBtn">Change code</button>
      <button type="button" class="chip-btn icon-btn" id="fsBtn" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15" fill="none" stroke="#2b2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Fullscreen</span>
      </button>
    </div>
    <div class="rotate-hint" id="rotateHint">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5" fill="#fff" stroke="#2b2340" stroke-width="2"/></svg>
      Rotate for the best experience
    </div>
  </main>

  <script type="module" src="/js/controller/controller.js"></script>
</body>
</html>
